<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟炒股小游戏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        up: '#ef4444',
                        down: '#22c55e',
                        neutral: '#6b7280'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen" onload="initGame()">
    <div class="container mx-auto px-4 py-6 max-w-7xl">
        <header class="mb-6">
            <h1 class="text-3xl font-bold text-center mb-4 bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">📈 模拟炒股小游戏</h1>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-gray-800 rounded-lg p-4 shadow-lg">
                    <div class="text-gray-400 text-sm">现金余额</div>
                    <div id="cashBalance" class="text-2xl font-bold text-green-400">¥10,000.00</div>
                </div>
                <div class="bg-gray-800 rounded-lg p-4 shadow-lg">
                    <div class="text-gray-400 text-sm">持仓市值</div>
                    <div id="positionValue" class="text-2xl font-bold text-yellow-400">¥0.00</div>
                </div>
                <div class="bg-gray-800 rounded-lg p-4 shadow-lg">
                    <div class="text-gray-400 text-sm">总资产</div>
                    <div id="totalAsset" class="text-2xl font-bold text-blue-400">¥10,000.00</div>
                </div>
                <div class="bg-gray-800 rounded-lg p-4 shadow-lg">
                    <div class="text-gray-400 text-sm">收益率</div>
                    <div id="profitRate" class="text-2xl font-bold">0.00%</div>
                </div>
            </div>

            <div class="mt-4 flex justify-between items-center">
                <div class="text-gray-400">
                    游戏时间: <span id="gameTime" class="text-white font-mono">00:00:00</span>
                    | 股价更新间隔: <span class="text-yellow-400">5秒</span>
                    | 下次更新: <span id="nextUpdate" class="text-red-400 font-mono">5s</span>
                </div>
                <button onclick="resetGame()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded transition">重新开始</button>
            </div>
        </header>

        <!-- 顶部广告位 -->
        <div class="mb-6 w-full">
            <div class="bg-gray-800 rounded-lg p-3 shadow-lg text-center border border-gray-700">
                <div class="text-gray-300">✨ 黄金曝光位置 - 欢迎洽谈合作 ✨</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2">
                <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden">
                    <div class="p-4 border-b border-gray-700">
                        <h2 class="text-xl font-bold">📊 股票市场 (共26支股票)</h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="bg-gray-700 text-gray-300 text-sm">
                                    <th class="px-3 py-3 text-left">代码</th>
                                    <th class="px-3 py-3 text-left">名称</th>
                                    <th class="px-3 py-3 text-right">现价</th>
                                    <th class="px-3 py-3 text-right">涨跌幅</th>
                                    <th class="px-3 py-3 text-right">持仓</th>
                                    <th class="px-3 py-3 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="stockList">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div>
                <div class="bg-gray-800 rounded-lg shadow-lg mb-4">
                    <div class="p-4 border-b border-gray-700">
                        <h2 class="text-xl font-bold">💱 交易操作</h2>
                    </div>
                    <div class="p-4">
                        <div id="selectedStockInfo" class="mb-4">
                            <div class="text-gray-400 text-center py-4">请点击股票进行交易</div>
                        </div>

                        <div id="tradePanel" class="hidden">
                            <div class="mb-3">
                                <label class="text-gray-400 text-sm">交易数量</label>
                                <input type="number" id="tradeQuantity" min="100" step="100" value="100" 
                                    class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 mt-1">
                                <div class="text-gray-500 text-xs mt-1">最少买入100股，以100股为单位</div>
                            </div>

                            <div class="mb-3">
                                <div class="text-gray-400 text-sm">交易金额</div>
                                <div id="tradeAmount" class="text-xl font-bold py-1">¥0.00</div>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="executeBuy()" id="buyBtn" 
                                    class="bg-red-600 hover:bg-red-700 py-3 rounded font-bold transition disabled:opacity-50 disabled:cursor-not-allowed">
                                    买入
                                </button>
                                <button onclick="executeSell()" id="sellBtn"
                                    class="bg-green-600 hover:bg-green-700 py-3 rounded font-bold transition disabled:opacity-50 disabled:cursor-not-allowed">
                                    卖出
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-lg shadow-lg">
                    <div class="p-4 border-b border-gray-700">
                        <h2 class="text-xl font-bold">💼 我的持仓</h2>
                    </div>
                    <div id="myPositions" class="max-h-64 overflow-y-auto">
                        <div class="text-gray-400 text-center py-4">暂无持仓</div>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-lg shadow-lg mt-4">
                    <div class="p-4 border-b border-gray-700">
                        <h2 class="text-xl font-bold">📝 交易记录</h2>
                    </div>
                    <div id="tradeHistory" class="max-h-48 overflow-y-auto text-sm">
                        <div class="text-gray-400 text-center py-4">暂无交易记录</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部广告位 -->
    <div class="container mx-auto px-4 max-w-7xl mt-8 mb-6">
        <div class="bg-gray-800 rounded-lg p-4 shadow-lg text-center border border-gray-700 w-full">
            <div class="text-gray-300 text-lg">✨ 黄金曝光位置 - 欢迎洽谈合作 ✨</div>
        </div>
        <div class="text-center mt-2 text-gray-500 text-xs">
            广告位招租 | 商务合作请联系: xsc040327@163.com
        </div>
    </div>

    <script>
        let gameState = {
            cash: 10000,
            positions: {},
            selectedStock: null,
            gameStartTime: Date.now(),
            updateCounter: 5,
            stocks: []
        };

        const stockNames = [
            {code: '000001', name: '小狗科技', base: 12.50},
            {code: '000002', name: '招财猫银行', base: 18.20},
            {code: '000063', name: '花开富贵', base: 32.80},
            {code: '000651', name: '糊锅巴', base: 35.40},
            {code: '000858', name: '毛毛超市', base: 156.30},
            {code: '002415', name: '七天酒店', base: 38.90},
            {code: '002475', name: 'W大辩论', base: 2.70},
            {code: '002594', name: '伪品会', base: 245.60},
            {code: '002714', name: '小羊牧业', base: 42.30},
            {code: '300059', name: '假品足道', base: 17.80},
            {code: '300124', name: '洛杉矶数码', base: 68.50},
            {code: '300750', name: '铁T消防', base: 198.20},
            {code: '300760', name: '丹佛婚纱', base: 320.40},
            {code: '600036', name: '中信不行', base: 33.60},
            {code: '600519', name: 'G州猫猫台', base: 1780.00},
            {code: '600585', name: '火箭过山车', base: 8.90},
            {code: '600887', name: '樱花城堡', base: 26.40},
            {code: '600900', name: '玛雅大姐', base: 24.50},
            {code: '601318', name: '包的兄弟', base: 45.70},
            {code: '601398', name: '元神启东', base: 4.82},
            {code: '601888', name: 'GTI军火', base: 123.50},
            {code: '601899', name: '食指矿业', base: 12.30},
            {code: '603259', name: '岗哨国际', base: 75.60},
            {code: '603288', name: '短江府', base: 38.20},
            {code: '688111', name: '河底捞', base: 276.80},
            {code: '688981', name: '银铲铲游戏', base: 56.70}
        ];

        function saveGameState() {
            const saveData = {
                cash: gameState.cash,
                positions: gameState.positions,
                stocks: gameState.stocks,
                gameStartTime: gameState.gameStartTime,
                savedAt: Date.now()
            };
            localStorage.setItem('stockGameState', JSON.stringify(saveData));
        }

        function loadGameState() {
            try {
                const saved = localStorage.getItem('stockGameState');
                if (saved) {
                    const data = JSON.parse(saved);
                    gameState.cash = data.cash;
                    gameState.positions = data.positions;
                    gameState.stocks = data.stocks;
                    gameState.gameStartTime = data.gameStartTime;
                    return true;
                }
            } catch(e) {
                console.log('加载存档失败，使用新游戏');
            }
            return false;
        }

        function initGame() {
            if (!loadGameState()) {
                gameState.stocks = stockNames.map(s => ({
                    ...s,
                    price: s.base,
                    prevPrice: s.base,
                    change: 0,
                    changePercent: 0,
                    history: [s.base]
                }));
            }
            
            renderStockList();
            updateUI();
            updatePositions();
            startGameLoop();
            
            document.getElementById('tradeQuantity').addEventListener('input', updateTradeAmount);
        }

        function startGameLoop() {
            setInterval(() => {
                gameState.updateCounter--;
                document.getElementById('nextUpdate').textContent = gameState.updateCounter + 's';
                
                if (gameState.updateCounter <= 0) {
                    updateStockPrices();
                    gameState.updateCounter = 5;
                }
                
                const elapsed = Math.floor((Date.now() - gameState.gameStartTime) / 1000);
                const hours = Math.floor(elapsed / 3600).toString().padStart(2, '0');
                const minutes = Math.floor((elapsed % 3600) / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');
                document.getElementById('gameTime').textContent = `${hours}:${minutes}:${seconds}`;
                
                updateUI();
            }, 1000);
        }

        function updateStockPrices() {
            gameState.stocks.forEach(stock => {
                const volatility = 0.03 + Math.random() * 0.05;
                const trend = (Math.random() - 0.48) * volatility;
                const jump = Math.random() < 0.08 ? (Math.random() - 0.5) * 0.08 : 0;
                
                stock.prevPrice = stock.price;
                stock.price = stock.price * (1 + trend + jump);
                stock.price = Math.max(stock.price, 1.00);
                stock.price = Math.round(stock.price * 100) / 100;
                
                stock.change = stock.price - stock.base;
                stock.changePercent = ((stock.price - stock.base) / stock.base) * 100;
                
                stock.history.push(stock.price);
                if (stock.history.length > 50) stock.history.shift();
                
                stock.moved = true;
            });
            
            renderStockList();
            updatePositions();
            saveGameState();
        }

        function renderStockList() {
            const container = document.getElementById('stockList');
            container.innerHTML = '';
            
            gameState.stocks.forEach(stock => {
                const position = gameState.positions[stock.code] || { quantity: 0 };
                const changeClass = stock.changePercent >= 0 ? 'text-up' : 'text-down';
                const arrow = stock.changePercent >= 0 ? '▲' : '▼';
                const rowBg = stock.moved ? 'bg-gray-700/50' : '';
                
                stock.moved = false;
                
                const row = document.createElement('tr');
                row.className = `border-b border-gray-700 hover:bg-gray-700/30 cursor-pointer transition ${rowBg}`;
                row.onclick = () => selectStock(stock.code);
                row.innerHTML = `
                    <td class="px-3 py-2 text-gray-400 font-mono text-sm">${stock.code}</td>
                    <td class="px-3 py-2 font-medium">${stock.name}</td>
                    <td class="px-3 py-2 text-right font-mono font-bold ${changeClass}">${stock.price.toFixed(2)}</td>
                    <td class="px-3 py-2 text-right font-mono ${changeClass}">
                        ${arrow} ${Math.abs(stock.changePercent).toFixed(2)}%
                    </td>
                    <td class="px-3 py-2 text-right text-yellow-400">${position.quantity > 0 ? position.quantity : '-'}</td>
                    <td class="px-3 py-2 text-center">
                        <button onclick="event.stopPropagation(); quickBuy('${stock.code}')" class="bg-up/20 text-up px-2 py-1 rounded text-xs mr-1 hover:bg-up/30">买</button>
                        ${position.quantity > 0 ? `<button onclick="event.stopPropagation(); quickSell('${stock.code}')" class="bg-down/20 text-down px-2 py-1 rounded text-xs hover:bg-down/30">卖</button>` : ''}
                    </td>
                `;
                container.appendChild(row);
            });
        }

        function selectStock(code) {
            gameState.selectedStock = gameState.stocks.find(s => s.code === code);
            renderSelectedStock();
        }

        function renderSelectedStock() {
            const stock = gameState.selectedStock;
            if (!stock) return;
            
            const position = gameState.positions[stock.code] || { quantity: 0, avgPrice: 0 };
            const changeClass = stock.changePercent >= 0 ? 'text-up' : 'text-down';
            const arrow = stock.changePercent >= 0 ? '▲' : '▼';
            
            document.getElementById('selectedStockInfo').innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <div>
                        <div class="font-bold text-lg">${stock.name}</div>
                        <div class="text-gray-400 text-sm">${stock.code}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-2xl font-bold ${changeClass}">${stock.price.toFixed(2)}</div>
                        <div class="${changeClass}">${arrow} ${Math.abs(stock.changePercent).toFixed(2)}%</div>
                    </div>
                </div>
                ${position.quantity > 0 ? `
                <div class="bg-gray-700/50 rounded p-2 text-sm">
                    <div class="flex justify-between">
                        <span class="text-gray-400">持仓:</span>
                        <span class="text-yellow-400">${position.quantity} 股</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">成本:</span>
                        <span>${position.avgPrice.toFixed(2)}</span>
                    </div>
                </div>
                ` : ''}
            `;
            
            document.getElementById('tradePanel').classList.remove('hidden');
            updateTradeAmount();
        }

        function updateTradeAmount() {
            if (!gameState.selectedStock) return;
            const qty = parseInt(document.getElementById('tradeQuantity').value) || 0;
            const amount = qty * gameState.selectedStock.price;
            document.getElementById('tradeAmount').textContent = '¥' + amount.toFixed(2);
        }

        function executeBuy() {
            if (!gameState.selectedStock) return;
            
            const qty = parseInt(document.getElementById('tradeQuantity').value);
            if (qty < 100 || qty % 100 !== 0) {
                alert('买入数量必须是100的整数倍');
                return;
            }
            
            const total = qty * gameState.selectedStock.price;
            if (total > gameState.cash) {
                alert('余额不足');
                return;
            }
            
            const code = gameState.selectedStock.code;
            if (!gameState.positions[code]) {
                gameState.positions[code] = { quantity: 0, avgPrice: 0 };
            }
            
            const pos = gameState.positions[code];
            const newQty = pos.quantity + qty;
            const newCost = (pos.quantity * pos.avgPrice + total) / newQty;
            
            pos.quantity = newQty;
            pos.avgPrice = newCost;
            gameState.cash -= total;
            
            addTradeHistory('买入', gameState.selectedStock, qty, gameState.selectedStock.price);
            updateUI();
            renderSelectedStock();
            renderStockList();
            updatePositions();
            saveGameState();
        }

        function executeSell() {
            if (!gameState.selectedStock) return;
            
            const code = gameState.selectedStock.code;
            const pos = gameState.positions[code];
            
            if (!pos || pos.quantity <= 0) {
                alert('没有持仓可卖');
                return;
            }
            
            const qty = parseInt(document.getElementById('tradeQuantity').value);
            if (qty < 100 || qty % 100 !== 0) {
                alert('卖出数量必须是100的整数倍');
                return;
            }
            
            if (qty > pos.quantity) {
                alert('持仓不足');
                return;
            }
            
            const total = qty * gameState.selectedStock.price;
            pos.quantity -= qty;
            
            if (pos.quantity === 0) {
                delete gameState.positions[code];
            }
            
            gameState.cash += total;
            
            addTradeHistory('卖出', gameState.selectedStock, qty, gameState.selectedStock.price);
            updateUI();
            renderSelectedStock();
            renderStockList();
            updatePositions();
            saveGameState();
        }

        function quickBuy(code) {
            selectStock(code);
            setTimeout(executeBuy, 50);
        }

        function quickSell(code) {
            selectStock(code);
            setTimeout(executeSell, 50);
        }

        function updatePositions() {
            const container = document.getElementById('myPositions');
            const positions = Object.entries(gameState.positions);
            
            if (positions.length === 0) {
                container.innerHTML = '<div class="text-gray-400 text-center py-4">暂无持仓</div>';
                return;
            }
            
            container.innerHTML = '';
            positions.forEach(([code, pos]) => {
                const stock = gameState.stocks.find(s => s.code === code);
                const profit = (stock.price - pos.avgPrice) * pos.quantity;
                const profitPercent = ((stock.price - pos.avgPrice) / pos.avgPrice) * 100;
                const profitClass = profit >= 0 ? 'text-up' : 'text-down';
                
                const item = document.createElement('div');
                item.className = 'p-3 border-b border-gray-700 hover:bg-gray-700/30 cursor-pointer';
                item.onclick = () => selectStock(code);
                item.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="font-medium">${stock.name}</div>
                            <div class="text-gray-400 text-xs">${pos.quantity} 股 @ ${pos.avgPrice.toFixed(2)}</div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold ${profitClass}">${profit >= 0 ? '+' : ''}${profit.toFixed(2)}</div>
                            <div class="text-xs ${profitClass}">${profit >= 0 ? '+' : ''}${profitPercent.toFixed(2)}%</div>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function addTradeHistory(type, stock, qty, price) {
            const container = document.getElementById('tradeHistory');
            const time = new Date().toLocaleTimeString();
            const total = qty * price;
            const typeClass = type === '买入' ? 'text-up' : 'text-down';
            
            const item = document.createElement('div');
            item.className = 'p-2 border-b border-gray-700/50';
            item.innerHTML = `
                <div class="flex justify-between">
                    <span>[${time}] <span class="${typeClass}">${type}</span> ${stock.name}</span>
                    <span>${qty}股 × ${price.toFixed(2)} = ¥${total.toFixed(0)}</span>
                </div>
            `;
            
            const firstChild = container.firstChild;
            if (firstChild && firstChild.textContent.includes('暂无交易记录')) {
                container.innerHTML = '';
            }
            
            container.insertBefore(item, container.firstChild);
            
            if (container.children.length > 20) {
                container.removeChild(container.lastChild);
            }
        }

        function updateUI() {
            document.getElementById('cashBalance').textContent = '¥' + gameState.cash.toFixed(2);
            
            let positionValue = 0;
            Object.entries(gameState.positions).forEach(([code, pos]) => {
                const stock = gameState.stocks.find(s => s.code === code);
                positionValue += pos.quantity * stock.price;
            });
            
            document.getElementById('positionValue').textContent = '¥' + positionValue.toFixed(2);
            
            const totalAsset = gameState.cash + positionValue;
            document.getElementById('totalAsset').textContent = '¥' + totalAsset.toFixed(2);
            
            const profitRate = ((totalAsset - 10000) / 10000) * 100;
            const profitEl = document.getElementById('profitRate');
            profitEl.textContent = (profitRate >= 0 ? '+' : '') + profitRate.toFixed(2) + '%';
            profitEl.className = 'text-2xl font-bold ' + (profitRate >= 0 ? 'text-up' : 'text-down');
        }

        function resetGame() {
            if (confirm('确定要重新开始游戏吗？所有持仓和资金将重置，存档也将清除。')) {
                localStorage.removeItem('stockGameState');
                gameState.cash = 10000;
                gameState.positions = {};
                gameState.selectedStock = null;
                gameState.gameStartTime = Date.now();
                gameState.stocks = [];
                
                document.getElementById('tradeHistory').innerHTML = '<div class="text-gray-400 text-center py-4">暂无交易记录</div>';
                document.getElementById('selectedStockInfo').innerHTML = '<div class="text-gray-400 text-center py-4">请点击股票进行交易</div>';
                document.getElementById('tradePanel').classList.add('hidden');
                
                initGame();
            }
        }
    </script>
</body>
</html>
